name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test -- --watch=false

      - run: npm run build ngx-signal-schema

      - run: npm pack --dry-run
        working-directory: dist/ngx-signal-schema
