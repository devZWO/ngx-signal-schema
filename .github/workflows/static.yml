name: Deploy Docs to GitHub Pages

on:
    workflow_dispatch:
    release:
        types: [published]

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages-${{ github.event_name }}
    cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
    deploy:
        # Serialize deployments while allowing newer manual runs to replace older ones.
        concurrency:
            group: pages-deployment
            cancel-in-progress: false
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Build documentation and demo
              run: npm run pages:build

            - name: Validate documentation and package
              run: node scripts/validate-docs-and-package.mjs

            - name: Setup Pages
              uses: actions/configure-pages@v6

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v5
              with:
                  path: docs/dist

            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
